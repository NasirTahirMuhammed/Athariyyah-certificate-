<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="مولّد شهادات المدرسة الأثرية — ذوق الطلاب في علم الإعراب"/>
<title>المدرسة الأثرية | مولّد الشهادات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Amiri',Georgia,serif;
    background:linear-gradient(135deg,#1a1a2e 0%,#2d2d5e 100%);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:32px 16px;gap:20px;
  }

  /* ── HEADER ── */
  .header{text-align:center;color:#d4a017;}
  .header .moon{font-size:34px;margin-bottom:6px;}
  .header h1{font-size:22px;margin-bottom:4px;font-weight:bold;}
  .header p{color:#9090b0;font-size:14px;}

  /* ── INPUT PANEL ── */
  .panel{
    background:rgba(255,255,255,0.06);
    border:1px solid #b8860b;border-radius:14px;
    padding:24px 28px;display:flex;flex-direction:column;gap:16px;
    width:100%;max-width:480px;
  }
  .field-label{color:#d4a017;font-size:13px;text-align:center;margin-bottom:6px;}
  .gender-row{display:flex;border:1px solid #b8860b;border-radius:10px;overflow:hidden;}
  .gbtn{
    flex:1;padding:12px 0;font-size:15px;font-family:'Amiri',Georgia,serif;
    border:none;cursor:pointer;font-weight:bold;transition:all .2s;
    background:rgba(255,255,255,0.04);color:#b8860b;
  }
  .gbtn.active-male{background:linear-gradient(90deg,#b8860b,#d4a017);color:#1a1a2e;}
  .gbtn.active-female{background:linear-gradient(90deg,#8b4513,#c0712b);color:#fff;}
  .gdivider{width:1px;background:#b8860b;}
  input[type=text]{
    width:100%;padding:12px 16px;font-size:17px;
    font-family:'Amiri',Georgia,serif;direction:rtl;text-align:right;
    background:rgba(255,255,255,0.08);border:1px solid #b8860b;
    border-radius:10px;color:#fff;outline:none;transition:border .2s;
  }
  input[type=text]:focus{border-color:#d4a017;}
  input::placeholder{color:rgba(255,255,255,0.3);}
  .gen-btn{
    padding:14px;font-size:17px;font-family:'Amiri',Georgia,serif;
    background:linear-gradient(90deg,#b8860b,#d4a017);
    color:#1a1a2e;font-weight:bold;border:none;
    border-radius:10px;cursor:pointer;letter-spacing:1px;
    box-shadow:0 4px 18px rgba(184,134,11,.35);
    transition:transform .15s;
  }
  .gen-btn:hover{transform:scale(1.02);}

  /* ── CERTIFICATE WRAPPER ── */
  #cert-wrap{overflow-x:auto;max-width:100%;display:none;}

  /* ── ACTION PANEL ── */
  .actions-panel{
    background:rgba(255,255,255,0.05);border:1px solid #b8860b;
    border-radius:14px;padding:20px 24px;
    display:none;flex-direction:column;gap:12px;
    width:100%;max-width:480px;
  }
  .section-label{
    color:#d4a017;font-size:14px;text-align:center;
    font-weight:bold;padding-bottom:4px;
    border-bottom:1px solid rgba(184,134,11,.3);
  }
  .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .abtn{
    padding:13px 10px;font-size:14px;font-family:'Amiri',Georgia,serif;
    border:none;border-radius:10px;cursor:pointer;font-weight:bold;
    transition:opacity .2s,transform .15s;
  }
  .abtn:hover{transform:scale(1.02);}
  .abtn:disabled{opacity:.55;cursor:not-allowed;transform:none;}
  .btn-pdf{background:linear-gradient(90deg,#8b0000,#c0392b);color:#fff;}
  .btn-png{background:linear-gradient(90deg,#145214,#27ae60);color:#fff;}
  .btn-wa{
    width:100%;padding:14px;font-size:16px;font-family:'Amiri',Georgia,serif;
    background:linear-gradient(90deg,#128C7E,#25D366);
    color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:bold;
    box-shadow:0 4px 15px rgba(37,211,102,.25);
    display:flex;align-items:center;justify-content:center;gap:10px;
    transition:transform .15s,opacity .2s;
  }
  .btn-wa:hover{transform:scale(1.02);}
  .btn-wa:disabled{opacity:.55;cursor:not-allowed;transform:none;}
  .wa-note{
    background:rgba(37,211,102,.07);border:1px solid rgba(37,211,102,.2);
    border-radius:10px;padding:11px 16px;font-size:12px;
    color:#8ecfb0;text-align:center;line-height:1.9;
  }
  #status{font-size:14px;font-weight:bold;text-align:center;min-height:18px;}
  .btn-new{
    padding:12px;font-size:14px;font-family:'Amiri',Georgia,serif;
    background:transparent;color:#d4a017;border:1px solid #b8860b;
    border-radius:10px;cursor:pointer;font-weight:bold;width:100%;
    transition:background .2s;
  }
  .btn-new:hover{background:rgba(184,134,11,.1);}

  /* ── CERTIFICATE ── */
  #certificate{
    width:820px;background:#fffdf5;position:relative;
    font-family:'Amiri',Georgia,serif;direction:rtl;
  }
  .b1{position:absolute;inset:10px;border:3px solid #1a1a2e;pointer-events:none;z-index:10;}
  .b2{position:absolute;inset:17px;border:2px solid #b8860b;pointer-events:none;z-index:10;}
  .b3{position:absolute;inset:23px;border:1px solid #d4a017;pointer-events:none;z-index:10;}
  .dm{position:absolute;width:12px;height:12px;background:#b8860b;z-index:12;transform:rotate(45deg);}
  .cert-inner{padding:50px 72px 36px;}
  .logo-wrap{text-align:center;margin-bottom:10px;}
  .logo-circle{
    display:inline-flex;align-items:center;justify-content:center;
    width:88px;height:88px;border-radius:50%;background:#1a1a2e;
    border:3px solid #b8860b;box-shadow:0 0 0 2px #d4a017;
    color:#d4a017;font-size:12px;font-weight:bold;line-height:1.7;text-align:center;
  }
  .ribbon{
    background:linear-gradient(90deg,#1a1a2e,#2a2a4e,#1a1a2e);
    padding:8px 40px;text-align:center;margin-bottom:14px;
    border-top:1px solid #b8860b;border-bottom:1px solid #b8860b;
    color:#d4a017;font-size:18px;font-weight:bold;letter-spacing:1px;
  }
  .ct{text-align:center;margin-bottom:4px;}
  .ct h1{font-size:26px;color:#1a1a2e;margin:0;font-weight:bold;}
  .cs{text-align:center;margin-bottom:18px;color:#b8860b;font-size:17px;font-weight:bold;}
  .div{display:flex;align-items:center;gap:8px;}
  .dl{flex:1;height:1px;background:linear-gradient(to left,#b8860b,transparent);}
  .dr{flex:1;height:1px;background:linear-gradient(to right,#b8860b,transparent);}
  .di{color:#b8860b;}
  .ct-body{text-align:center;line-height:2.1;color:#222;font-size:14px;}
  .ct-body p{margin:0 0 2px;}
  .sn-wrap{text-align:center;margin:6px 0 14px;}
  .sn{
    font-size:28px;font-weight:bold;color:#c05c00;
    border-bottom:2px solid #b8860b;padding-bottom:3px;
    display:inline-block;min-width:270px;letter-spacing:2px;
  }
  .cf{display:flex;justify-content:space-between;font-size:13px;color:#1a1a2e;position:relative;align-items:flex-end;}
  .fc{text-align:center;}
  .fl{color:#888;font-size:11px;margin-bottom:3px;}
  .fv{font-weight:bold;border-top:1px solid #b8860b;padding-top:3px;}
  .fs{font-style:italic;font-size:14px;}
  .wm{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:74px;height:74px;border-radius:50%;
    border:3px solid rgba(180,50,50,.12);
    display:flex;align-items:center;justify-content:center;
  }
  .wm span{color:rgba(180,50,50,.1);font-size:9px;text-align:center;line-height:1.5;}
  .cdots{text-align:center;padding-bottom:28px;color:#b8860b;font-size:10px;letter-spacing:7px;}

  /* ── FOOTER ── */
  .site-footer{
    color:#5060a0;font-size:12px;text-align:center;
    padding:10px 0 20px;
  }

  @media print{
    body>*:not(#cert-wrap){display:none!important;}
    body{background:white;padding:0;}
    #cert-wrap{display:block!important;overflow:visible;}
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="moon">☽</div>
  <h1>مولّد شهادات المدرسة الأثرية</h1>
  <p>ذوق الطلاب في علم الإعراب — مقدمة في علم النحو</p>
</div>

<!-- INPUT PANEL -->
<div class="panel">
  <div>
    <div class="field-label">نوع الطالب</div>
    <div class="gender-row">
      <button class="gbtn active-male" id="btn-male" onclick="setGender('male')">👦 ذكر</button>
      <div class="gdivider"></div>
      <button class="gbtn" id="btn-female" onclick="setGender('female')">👧 أنثى</button>
    </div>
  </div>
  <div>
    <div class="field-label" id="name-label">اسم الطالب</div>
    <input type="text" id="name-input"
      placeholder="مثال: أحمد بن محمد الأنصاري"
      onkeydown="if(event.key==='Enter')generate()"/>
  </div>
  <button class="gen-btn" onclick="generate()">✦ إنشاء الشهادة ✦</button>
</div>

<!-- CERTIFICATE OUTPUT -->
<div id="cert-wrap"></div>

<!-- ACTION BUTTONS -->
<div class="actions-panel" id="actions-panel">
  <div class="section-label">💾 تنزيل الشهادة</div>
  <div class="btn-grid">
    <button class="abtn btn-pdf" id="btn-pdf" onclick="downloadPDF()">📄 تنزيل PDF</button>
    <button class="abtn btn-png" id="btn-png" onclick="downloadPNG()">🖼️ تنزيل PNG</button>
  </div>

  <div class="section-label" style="margin-top:4px">📲 مشاركة عبر WhatsApp</div>
  <button class="btn-wa" id="btn-wa" onclick="shareWhatsApp()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
    مشاركة الشهادة على WhatsApp
  </button>

  <div class="wa-note">
    📱 على الجوال: يفتح WhatsApp مع ملف الشهادة مباشرةً<br/>
    🖥️ على الكمبيوتر: يُرسَل رسالة نصية لناصر طاهر محمد
  </div>

  <div id="status"></div>
  <button class="btn-new" onclick="reset()">↩ شهادة طالب جديد</button>
</div>

<div class="site-footer">المدرسة الأثرية &mdash; جميع الحقوق محفوظة &copy; 2026</div>

<script>
const WA = "2348146584652";
let currentGender = "male", currentName = "";

const TEXTS = {
  male:{
    label:"اسم الطالب",
    ph:"مثال: أحمد بن محمد الأنصاري",
    student:"الطالب الكريم:",
    part:"قد شارك في دورة",
    bless:"نسأل الله أن يبارك في علمه — والله ولي التوفيق"
  },
  female:{
    label:"اسم الطالبة",
    ph:"مثال: فاطمة بنت عبد الله",
    student:"الطالبة الكريمة:",
    part:"قد شاركت في دورة",
    bless:"نسأل الله أن يبارك في علمها — والله ولي التوفيق"
  }
};

function setGender(g){
  currentGender=g;
  document.getElementById("btn-male").className="gbtn"+(g==="male"?" active-male":"");
  document.getElementById("btn-female").className="gbtn"+(g==="female"?" active-female":"");
  document.getElementById("name-label").textContent=TEXTS[g].label;
  document.getElementById("name-input").placeholder=TEXTS[g].ph;
}

function cert(name,g){
  const t=TEXTS[g];
  return `<div id="certificate">
  <div class="b1"></div><div class="b2"></div><div class="b3"></div>
  <div class="dm" style="top:7px;left:50%;transform:translateX(-50%) rotate(45deg)"></div>
  <div class="dm" style="bottom:7px;left:50%;transform:translateX(-50%) rotate(45deg)"></div>
  <div class="dm" style="left:7px;top:50%;transform:translateY(-50%) rotate(45deg)"></div>
  <div class="dm" style="right:7px;top:50%;transform:translateY(-50%) rotate(45deg)"></div>
  <svg width="54" height="54" style="position:absolute;top:10px;left:10px;z-index:11" viewBox="0 0 54 54"><g transform="rotate(0,27,27)"><path d="M7 7L7 27L11 27L11 11L27 11L27 7Z" fill="#b8860b"/><circle cx="18" cy="18" r="5" fill="#b8860b"/><circle cx="18" cy="18" r="2.5" fill="#fffdf5"/></g></svg>
  <svg width="54" height="54" style="position:absolute;top:10px;right:10px;z-index:11" viewBox="0 0 54 54"><g transform="rotate(90,27,27)"><path d="M7 7L7 27L11 27L11 11L27 11L27 7Z" fill="#b8860b"/><circle cx="18" cy="18" r="5" fill="#b8860b"/><circle cx="18" cy="18" r="2.5" fill="#fffdf5"/></g></svg>
  <svg width="54" height="54" style="position:absolute;bottom:10px;right:10px;z-index:11" viewBox="0 0 54 54"><g transform="rotate(180,27,27)"><path d="M7 7L7 27L11 27L11 11L27 11L27 7Z" fill="#b8860b"/><circle cx="18" cy="18" r="5" fill="#b8860b"/><circle cx="18" cy="18" r="2.5" fill="#fffdf5"/></g></svg>
  <svg width="54" height="54" style="position:absolute;bottom:10px;left:10px;z-index:11" viewBox="0 0 54 54"><g transform="rotate(270,27,27)"><path d="M7 7L7 27L11 27L11 11L27 11L27 7Z" fill="#b8860b"/><circle cx="18" cy="18" r="5" fill="#b8860b"/><circle cx="18" cy="18" r="2.5" fill="#fffdf5"/></g></svg>
  <div class="cert-inner">
    <div class="logo-wrap"><div class="logo-circle">المدرسة<br/>الأثرية</div></div>
    <div class="ribbon">المدرسة الأثرية</div>
    <div class="ct"><h1>شهادة إتمام دورة النحو</h1></div>
    <div class="cs">ذوق الطلاب في علم الإعراب</div>
    <div class="div" style="margin-bottom:16px"><div class="dl"></div><span class="di">❖</span><div class="dr"></div></div>
    <div class="ct-body">
      <p>الحمد لله رب العالمين والصلاة والسلام على نبينا محمد وعلى آله وصحبه أجمعين</p>
      <p style="margin-bottom:12px">وبعد؛ فإن ${t.student}</p>
    </div>
    <div class="sn-wrap"><span class="sn">${name}</span></div>
    <div class="ct-body">
      <p>${t.part} <strong>ذوق الطلاب في علم الإعراب</strong> — مقدمة في علم النحو</p>
      <p>وذلك بتاريخ <strong>الأربعاء ٢٠ مايو ٢٠٢٦م</strong> بمسجد أدانكولو المركزي</p>
      <p style="color:#555;font-size:13px;font-style:italic">${t.bless}</p>
    </div>
    <div class="div" style="margin:14px 0"><div class="dl"></div><span class="di" style="font-size:12px">✦ ✦ ✦</span><div class="dr"></div></div>
    <div class="cf">
      <div class="fc"><div class="fl">التوقيع</div><div class="fv fs">ناصر طاهر محمد</div></div>
      <div class="wm"><span>المدرسة<br/>الأثرية</span></div>
      <div class="fc"><div class="fl">التاريخ</div><div class="fv">٢٠ مايو ٢٠٢٦م</div></div>
    </div>
  </div>
  <div class="cdots">◆ · · · ◆ · · · ◆ · · · ◆</div>
</div>`;
}

function generate(){
  const name=document.getElementById("name-input").value.trim();
  if(!name)return;
  currentName=name;
  const cw=document.getElementById("cert-wrap");
  cw.innerHTML=cert(name,currentGender);
  cw.style.display="block";
  document.getElementById("actions-panel").style.display="flex";
  setStatus("","");
  cw.scrollIntoView({behavior:"smooth",block:"start"});
}

function setStatus(msg,color){
  const el=document.getElementById("status");
  el.textContent=msg; el.style.color=color||"#d4a017";
}

function setLoading(on){
  ["btn-pdf","btn-png","btn-wa"].forEach(id=>{
    const b=document.getElementById(id); if(b)b.disabled=on;
  });
}

async function getCanvas(){
  return await html2canvas(document.getElementById("certificate"),{
    scale:2,useCORS:true,backgroundColor:"#fffdf5"
  });
}

function triggerDownload(url,filename){
  const a=document.createElement("a");
  a.href=url; a.download=filename; a.target="_blank";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
}

async function downloadPDF(){
  setLoading(true); setStatus("⏳ جاري إنشاء PDF...","#d4a017");
  try{
    const canvas=await getCanvas();
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:"landscape",unit:"px",format:[canvas.width/2,canvas.height/2]});
    pdf.addImage(canvas.toDataURL("image/jpeg",1),"JPEG",0,0,canvas.width/2,canvas.height/2);
    triggerDownload(URL.createObjectURL(pdf.output("blob")),`شهادة-${currentName}.pdf`);
    setStatus("✅ تم تنزيل PDF بنجاح!","#27ae60");
  }catch(e){setStatus("❌ "+e.message,"#e74c3c");}
  setLoading(false);
}

async function downloadPNG(){
  setLoading(true); setStatus("⏳ جاري إنشاء الصورة...","#d4a017");
  try{
    const canvas=await getCanvas();
    canvas.toBlob(blob=>{
      triggerDownload(URL.createObjectURL(blob),`شهادة-${currentName}.png`);
      setStatus("✅ تم تنزيل الصورة بنجاح!","#27ae60");
      setLoading(false);
    },"image/png",1.0);
  }catch(e){setStatus("❌ "+e.message,"#e74c3c");setLoading(false);}
}

async function shareWhatsApp(){
  setLoading(true); setStatus("⏳ جاري التحضير...","#d4a017");
  try{
    const canvas=await getCanvas();
    canvas.toBlob(async blob=>{
      const file=new File([blob],`شهادة-${currentName}.png`,{type:"image/png"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{
          await navigator.share({
            files:[file],
            title:`شهادة ${currentName} — المدرسة الأثرية`,
            text:`السلام عليكم،\nنرفق شهادة *${currentName}* في دورة ذوق الطلاب في علم الإعراب.\nالمدرسة الأثرية 🎓`
          });
          setStatus("✅ تمت المشاركة بنجاح!","#27ae60");
        }catch(e){
          if(e.name!=="AbortError") openWALink();
          else setStatus("","");
        }
      } else { openWALink(); }
      setLoading(false);
    },"image/png",1.0);
  }catch(e){setStatus("❌ "+e.message,"#e74c3c");setLoading(false);}
}

function openWALink(){
  const text=encodeURIComponent(`السلام عليكم،\nنرفق شهادة *${currentName}* في دورة ذوق الطلاب في علم الإعراب — المدرسة الأثرية 🎓\nيرجى تنزيل الشهادة وإرسالها للطالب.`);
  window.open(`https://wa.me/${WA}?text=${text}`,"_blank");
  setStatus("✅ تم فتح WhatsApp!","#27ae60");
}

function reset(){
  document.getElementById("name-input").value="";
  document.getElementById("cert-wrap").style.display="none";
  document.getElementById("cert-wrap").innerHTML="";
  document.getElementById("actions-panel").style.display="none";
  setStatus("",""); currentName="";
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body>
</html>
